#!MANAGED-CONFIG https://cdn.jsdelivr.net/gh/xszo/etc@etc/surge/base.conf interval=86400 strict=false


[General]
loglevel = warning
wifi-assist = true
internet-test-url = http://1.1.1.1/
proxy-test-url = http://1.1.1.1/
proxy-test-udp = nic.com@1.1.1.1
hijack-dns = *:53
dns-server = 223.5.5.5, 223.6.6.6
encrypted-dns-server = https://223.5.5.5/dns-query, https://223.6.6.6/dns-query

[Proxy Group]
Default = select, DIRECT, REJECT, Node, Node0, Node1, CN, DE, FR, GB, HK, JP, KR, NL, SG, TW, US
R-CN = select, Default, DIRECT, Node, Node0, Node1, CN, DE, FR, GB, HK, JP, KR, NL, SG, TW, US
R-JP = select, Default, DIRECT, Node, Node0, Node1, CN, DE, FR, GB, HK, JP, KR, NL, SG, TW, US
R-TW = select, Default, DIRECT, Node, Node0, Node1, CN, DE, FR, GB, HK, JP, KR, NL, SG, TW, US
R-US = select, Default, DIRECT, Node, Node0, Node1, CN, DE, FR, GB, HK, JP, KR, NL, SG, TW, US
Node = smart, policy-priority="\[2\]:2;\[4\]:4;\[8\]:8;", include-all-proxies=true, policy-regex-filter="^"
Node0 = select, include-all-proxies=true, policy-regex-filter="^"
Node1 = select, include-all-proxies=true, policy-regex-filter="^"
CN = smart, policy-priority="\[2\]:2;\[4\]:4;\[8\]:8;", include-all-proxies=true, policy-regex-filter="(?<![A-Za-z])CH?N(?![A-Za-z])|China|Shanghai|中國|中国|中(?![\u4E00-\u9FFF])"
DE = smart, policy-priority="\[2\]:2;\[4\]:4;\[8\]:8;", include-all-proxies=true, policy-regex-filter="(?<![A-Za-z])DEU?(?![A-Za-z])|Deutsch|Germany?|Berlin|德國|德国|德(?![\u4E00-\u9FFF])"
FR = smart, policy-priority="\[2\]:2;\[4\]:4;\[8\]:8;", include-all-proxies=true, policy-regex-filter="(?<![A-Za-z])FRA?(?![A-Za-z])|France|French|Paris|法國|法国|法(?![\u4E00-\u9FFF])"
GB = smart, policy-priority="\[2\]:2;\[4\]:4;\[8\]:8;", include-all-proxies=true, policy-regex-filter="(?<![A-Za-z\d]|\d\s)GBR?(?![A-Za-z])|Britain|British|UK|United\s?Kingdom|London|英國|英国|英(?![\u4E00-\u9FFF])"
HK = smart, policy-priority="\[2\]:2;\[4\]:4;\[8\]:8;", include-all-proxies=true, policy-regex-filter="(?<![A-Za-z])HKG?(?![A-Za-z])|Hong\s?Kong|香港|港(?![\u4E00-\u9FFF])"
JP = smart, policy-priority="\[2\]:2;\[4\]:4;\[8\]:8;", include-all-proxies=true, policy-regex-filter="(?<![A-Za-z])JPN?(?![A-Za-z])|Japan|Japanese|Tokyo|Osaka|日本國?|(?<!尼)日(?![\u4E00-\u9FFF])"
KR = smart, policy-priority="\[2\]:2;\[4\]:4;\[8\]:8;", include-all-proxies=true, policy-regex-filter="(?<![A-Za-z])KO?R(?![A-Za-z])|Korean?|Seoul|韓國|韩国|韩(?![\u4E00-\u9FFF])"
NL = smart, policy-priority="\[2\]:2;\[4\]:4;\[8\]:8;", include-all-proxies=true, policy-regex-filter="(?<![A-Za-z])NLD?(?![A-Za-z])|Netherlands|Holland|Amsterdam|荷蘭|荷兰|荷(?![\u4E00-\u9FFF])"
SG = smart, policy-priority="\[2\]:2;\[4\]:4;\[8\]:8;", include-all-proxies=true, policy-regex-filter="(?<![A-Za-z])SGP?(?![A-Za-z])|Singapore|新加坡|獅城|狮城|新(?![\u4E00-\u9FFF])"
TW = smart, policy-priority="\[2\]:2;\[4\]:4;\[8\]:8;", include-all-proxies=true, policy-regex-filter="(?<![A-Za-z])TWN?(?![A-Za-z])|Taiwan|Taiwanese|Taipei|台灣|台湾|台(?![\u4E00-\u9FFF])"
US = smart, policy-priority="\[2\]:2;\[4\]:4;\[8\]:8;", include-all-proxies=true, policy-regex-filter="(?<![A-Za-z])(?:USA?|NY|LA)(?![A-Za-z])|United\s?States|American?|美國|美国|美(?![\u4E00-\u9FFF])"

[Rule]
RULE-SET, https://cdn.jsdelivr.net/gh/xszo/etc@etc/surge/filter-dn+world.txt, Default, no-resolve, extended-matching
RULE-SET, https://cdn.jsdelivr.net/gh/xszo/etc@etc/surge/filter-dn+cn.txt, R-CN, no-resolve, extended-matching
RULE-SET, https://cdn.jsdelivr.net/gh/xszo/etc@etc/surge/filter-dn+jp.txt, R-JP, no-resolve, extended-matching
RULE-SET, https://cdn.jsdelivr.net/gh/xszo/etc@etc/surge/filter-dn+tw.txt, R-TW, no-resolve, extended-matching
RULE-SET, https://cdn.jsdelivr.net/gh/xszo/etc@etc/surge/filter-dn+us.txt, R-US, no-resolve, extended-matching
RULE-SET, https://cdn.jsdelivr.net/gh/xszo/etc@etc/surge/filter-ip+world.txt, Default
RULE-SET, https://cdn.jsdelivr.net/gh/xszo/etc@etc/surge/filter-ip+cn.txt, R-CN
RULE-SET, https://cdn.jsdelivr.net/gh/xszo/etc@etc/surge/filter-ip+jp.txt, R-JP
RULE-SET, https://cdn.jsdelivr.net/gh/xszo/etc@etc/surge/filter-ip+tw.txt, R-TW
FINAL, Default, dns-failed
