#!MANAGED-CONFIG https://cdn.jsdelivr.net/gh/xszo/etc@etc/surge/base+cn.conf interval=86400 strict=false


[General]
loglevel = warning
wifi-assist = true
internet-test-url = http://1.1.1.1/
proxy-test-url = http://1.1.1.1/
proxy-test-udp = nic.com@1.1.1.1
hijack-dns = *:53
dns-server = 223.5.5.5, 223.6.6.6
encrypted-dns-server = https://223.5.5.5/dns-query, https://223.6.6.6/dns-query

[Proxy Group]
JP = smart, policy-priority="\[2\]:2;\[4\]:4;\[8\]:8;", include-all-proxies=true, policy-regex-filter="(?<![A-Za-z])JPN?(?![A-Za-z])|Japan|Japanese|Tokyo|Osaka|日本國?|(?<!尼)日(?![\u4E00-\u9FFF])"
TW = smart, policy-priority="\[2\]:2;\[4\]:4;\[8\]:8;", include-all-proxies=true, policy-regex-filter="(?<![A-Za-z])TWN?(?![A-Za-z])|Taiwan|Taiwanese|Taipei|台灣|台湾|台(?![\u4E00-\u9FFF])"
US = smart, policy-priority="\[2\]:2;\[4\]:4;\[8\]:8;", include-all-proxies=true, policy-regex-filter="(?<![A-Za-z])(?:USA?|NY|LA)(?![A-Za-z])|United\s?States|American?|美國|美国|美(?![\u4E00-\u9FFF])"

[Rule]
RULE-SET, https://cdn.jsdelivr.net/gh/xszo/etc@etc/surge/filter-dn+world.txt, TW, no-resolve, extended-matching
RULE-SET, https://cdn.jsdelivr.net/gh/xszo/etc@etc/surge/filter-dn+cn.txt, DIRECT, no-resolve, extended-matching
RULE-SET, https://cdn.jsdelivr.net/gh/xszo/etc@etc/surge/filter-dn+jp.txt, JP, no-resolve, extended-matching
RULE-SET, https://cdn.jsdelivr.net/gh/xszo/etc@etc/surge/filter-dn+tw.txt, TW, no-resolve, extended-matching
RULE-SET, https://cdn.jsdelivr.net/gh/xszo/etc@etc/surge/filter-dn+us.txt, US, no-resolve, extended-matching
RULE-SET, https://cdn.jsdelivr.net/gh/xszo/etc@etc/surge/filter-ip+world.txt, TW
RULE-SET, https://cdn.jsdelivr.net/gh/xszo/etc@etc/surge/filter-ip+cn.txt, DIRECT
RULE-SET, https://cdn.jsdelivr.net/gh/xszo/etc@etc/surge/filter-ip+jp.txt, JP
RULE-SET, https://cdn.jsdelivr.net/gh/xszo/etc@etc/surge/filter-ip+tw.txt, TW
FINAL, TW, dns-failed
